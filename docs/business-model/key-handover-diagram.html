<title>サロン締め作業代行 鍵の受け渡し</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
/* Layout: A4横（297×210mm）の紙面を1枚のSVGで描き、画面では幅に合わせて縮小。印刷用の白い紙面に固定した単一テーマ */
:root{
  --desk:#e6ecec; --paper:#ffffff; --ink:#1b2627; --muted:#5b6b6d;
  --font:"Zen Kaku Gothic New","IPAGothic","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:light;
}
body{background:var(--desk);color:var(--ink);font-family:var(--font)}
.wrap{padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;justify-items:center;gap:12px}
.paper{width:100%;max-width:1188px;aspect-ratio:297/210;background:var(--paper);box-shadow:0 2px 14px rgba(27,38,39,.12)}
.paper svg{display:block;width:100%;height:100%}
.cap{font-size:12px;color:var(--muted);max-width:1188px;width:100%}
svg text{font-family:var(--font)}
@page{size:A4 landscape;margin:0}
@media print{
  body{background:#fff}
  .wrap{padding:0}
  .paper{width:297mm;height:210mm;max-width:none;box-shadow:none}
  .cap{display:none}
}
</style>

<text x="164" y="176" font-size="12" fill="#1b2627">暗証番号で</text>
<text x="164" y="194" font-size="12" fill="#1b2627">鍵を出し入れ</text>
<text x="164" y="212" font-size="12" fill="#1b2627">できる受け渡し機</text>
<text x="164" y="248" font-size="11.5" fill="#5b6b6d">スロット型</text>
<text x="164" y="268" font-size="15" font-weight="700" fill="#1b2627">月3,000円</text>
<text x="164" y="296" font-size="11.5" fill="#5b6b6d">ボックス型</text>
<text x="164" y="316" font-size="15" font-weight="700" fill="#1b2627">月5,000円</text>
<text x="164" y="336" font-size="11" fill="#5b6b6d">48時間なら500円</text>
<text x="164" y="360" font-size="11" fill="#5b6b6d">（税抜・1鍵）</text>
<text x="48" y="400" font-size="10.5" fill="#5b6b6d">写真：KEY STATION 端末</text>
<rect x="308" y="116" width="850" height="300" rx="14" fill="#f4f7f7"/>
<text x="328" y="146" font-size="16" font-weight="700" fill="#1b2627">受け渡しから清掃までの流れ</text>
<text x="1138" y="146" font-size="12" text-anchor="end" fill="#5b6b6d">例：表参道エリア（サロンA・B）</text>
<rect x="328.0" y="160" width="122" height="196" rx="10" fill="#ffffff" stroke="#cfd9d9"/>
<circle cx="348.0" cy="182" r="12" fill="#0f7c80"/>
<text x="348.0" y="187" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<text x="366.0" y="187" font-size="11" font-weight="700" fill="#1b2627">契約時</text>
<text x="340.0" y="220" font-size="14" font-weight="700" fill="#1b2627">合鍵を預かる</text>
<text x="340.0" y="246" font-size="11.5" fill="#1b2627">SaNSが契約した</text>
<text x="340.0" y="264" font-size="11.5" fill="#1b2627">サロンから合鍵を預</text>
<text x="340.0" y="282" font-size="11.5" fill="#1b2627">かる</text>
<path d="M453.0,252 l6,6 l-6,6" fill="none" stroke="#9aa8aa" stroke-width="2"/>
<rect x="463.6" y="160" width="122" height="196" rx="10" fill="#ffffff" stroke="#cfd9d9"/>
<circle cx="483.6" cy="182" r="12" fill="#0f7c80"/>
<text x="483.6" y="187" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<text x="501.6" y="187" font-size="11" font-weight="700" fill="#1b2627">常時</text>
<text x="475.6" y="220" font-size="14" font-weight="700" fill="#1b2627">エリアで保管</text>
<text x="475.6" y="246" font-size="11.5" fill="#1b2627">SaNSがエリアの</text>
<text x="475.6" y="264" font-size="11.5" fill="#1b2627">ステーションに預け</text>
<text x="475.6" y="282" font-size="11.5" fill="#1b2627">ておく（表参道なら</text>
<text x="475.6" y="300" font-size="11.5" fill="#1b2627">フィルパーク表参道</text>
<text x="475.6" y="318" font-size="11.5" fill="#1b2627">テラス）</text>
<path d="M588.6,252 l6,6 l-6,6" fill="none" stroke="#9aa8aa" stroke-width="2"/>
<rect x="599.2" y="160" width="122" height="196" rx="10" fill="#ffffff" stroke="#cfd9d9"/>
<circle cx="619.2" cy="182" r="12" fill="#0f7c80"/>
<text x="619.2" y="187" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<text x="637.2" y="187" font-size="11" font-weight="700" fill="#1b2627">シフト確定時</text>
<text x="611.2" y="220" font-size="14" font-weight="700" fill="#1b2627">番号を連絡</text>
<text x="611.2" y="246" font-size="11.5" fill="#1b2627">SaNSが担当スタ</text>
<text x="611.2" y="264" font-size="11.5" fill="#1b2627">ッフに暗証番号を伝</text>
<text x="611.2" y="282" font-size="11.5" fill="#1b2627">える（チャットワー</text>
<text x="611.2" y="300" font-size="11.5" fill="#1b2627">ク）</text>
<path d="M724.2,252 l6,6 l-6,6" fill="none" stroke="#9aa8aa" stroke-width="2"/>
<rect x="734.8" y="160" width="122" height="196" rx="10" fill="#ffffff" stroke="#cfd9d9"/>
<circle cx="754.8" cy="182" r="12" fill="#0f7c80"/>
<text x="754.8" y="187" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
<text x="772.8" y="187" font-size="11" font-weight="700" fill="#0f7c80">20:05</text>
<text x="746.8" y="220" font-size="14" font-weight="700" fill="#1b2627">鍵を受け取る</text>
<text x="746.8" y="246" font-size="11.5" fill="#1b2627">ステーションでサロ</text>
<text x="746.8" y="264" font-size="11.5" fill="#1b2627">ンAとサロンBの鍵</text>
<text x="746.8" y="282" font-size="11.5" fill="#1b2627">を受け取る</text>
<path d="M859.8,252 l6,6 l-6,6" fill="none" stroke="#9aa8aa" stroke-width="2"/>
<rect x="870.4" y="160" width="122" height="196" rx="10" fill="#ffffff" stroke="#cfd9d9"/>
<circle cx="890.4" cy="182" r="12" fill="#0f7c80"/>
<text x="890.4" y="187" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
<text x="908.4" y="187" font-size="11" font-weight="700" fill="#0f7c80">20:15–22:25</text>
<text x="882.4" y="220" font-size="14" font-weight="700" fill="#1b2627">2店を清掃</text>
<text x="882.4" y="246" font-size="11.5" fill="#1b2627">サロンA→サロンB</text>
<text x="882.4" y="264" font-size="11.5" fill="#1b2627">の順に清掃し、作業</text>
<text x="882.4" y="282" font-size="11.5" fill="#1b2627">前後の写真で報告</text>
<path d="M995.4,252 l6,6 l-6,6" fill="none" stroke="#9aa8aa" stroke-width="2"/>
<rect x="1006.0" y="160" width="122" height="196" rx="10" fill="#ffffff" stroke="#cfd9d9"/>
<circle cx="1026.0" cy="182" r="12" fill="#0f7c80"/>
<text x="1026.0" y="187" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">6</text>
<text x="1044.0" y="187" font-size="11" font-weight="700" fill="#0f7c80">22:35</text>
<text x="1018.0" y="220" font-size="14" font-weight="700" fill="#1b2627">施錠・返却</text>
<text x="1018.0" y="246" font-size="11.5" fill="#1b2627">2店を施錠し、鍵を</text>
<text x="1018.0" y="264" font-size="11.5" fill="#1b2627">ステーションに戻す。</text>
<text x="1018.0" y="282" font-size="11.5" fill="#1b2627">SaNSが返却を</text>
<text x="1018.0" y="300" font-size="11.5" fill="#1b2627">確認</text>
<rect x="734.8" y="364" width="393.2" height="22" rx="11" fill="#e1f0f0"/>
<text x="931.4" y="379" font-size="11.5" font-weight="700" text-anchor="middle" fill="#0f7c80">ここが清掃スタッフの作業（ステーションと店の往復を含む）</text>
<text x="328" y="404" font-size="10.5" fill="#5b6b6d">※ 返却が22時半以降になるため、ステーションが深夜も使えるか、番号を担当者ごとに分けられるかはKeeylsへ要確認</text>

<text x="50" y="776" font-size="11" fill="#1b2627">フィルパーク表参道テラス（渋谷区神宮前4-21-1）。スロット型 月3,000円、空き19枠</text>
<text x="50" y="796" font-size="10.5" fill="#5b6b6d">画面：KEY STATION 検索ページで「表参道」を検索（2026年10月時点）</text>
<rect x="614" y="432" width="544" height="376" rx="14" fill="#f4f7f7"/>
<text x="634" y="462" font-size="16" font-weight="700" fill="#1b2627">メリット・デメリットと、もう一つの選択肢</text>
<text x="634" y="486" font-size="13" font-weight="700" fill="#2f7d4a">メリット</text>
<text x="634" y="508" font-size="12" font-weight="700" fill="#2f7d4a">＋</text>
<text x="650" y="508" font-size="11.5" fill="#1b2627">サロン側の工事や機器の設置がいらない</text>
<text x="634" y="530" font-size="12" font-weight="700" fill="#2f7d4a">＋</text>
<text x="650" y="530" font-size="11.5" fill="#1b2627">サロンが集まるエリアなら、1か所で複数</text>
<text x="650" y="546" font-size="11.5" fill="#1b2627">店の鍵を受け取れる</text>
<text x="634" y="568" font-size="12" font-weight="700" fill="#2f7d4a">＋</text>
<text x="650" y="568" font-size="11.5" fill="#1b2627">1店あたり月3,000円。事務所がなく</text>
<text x="650" y="584" font-size="11.5" fill="#1b2627">ても同じ運用で広げられる</text>
<text x="892" y="486" font-size="13" font-weight="700" fill="#b23b3b">デメリット</text>
<text x="892" y="508" font-size="12" font-weight="700" fill="#b23b3b">−</text>
<text x="908" y="508" font-size="11.5" fill="#1b2627">商業施設に多く、深夜に返却できない場所</text>
<text x="908" y="524" font-size="11.5" fill="#1b2627">がある</text>
<text x="892" y="546" font-size="12" font-weight="700" fill="#b23b3b">−</text>
<text x="908" y="546" font-size="11.5" fill="#1b2627">ステーションと店の往復で移動が増える</text>
<text x="892" y="568" font-size="12" font-weight="700" fill="#b23b3b">−</text>
<text x="908" y="568" font-size="11.5" fill="#1b2627">SaNSが鍵を預かるため、紛失時の補償</text>
<text x="908" y="584" font-size="11.5" fill="#1b2627">と管理規程が必要</text>
<rect x="634" y="618" width="504" height="94" rx="8" fill="#ffffff" stroke="#c4621d" stroke-width="1.5"/>
<text x="650" y="641" font-size="13" font-weight="700" fill="#c4621d">選択肢：店の前にキーボックスを置く</text>
<text x="650" y="662" font-size="11.5" fill="#1b2627">暗証番号付きのスマートキーボックス（例：igloohome、約2.5〜3万円）に合鍵を入れる。</text>
<text x="650" y="679" font-size="11.5" fill="#1b2627">担当者ごと・時間限定の番号を遠隔で発行でき、開閉の記録も残る。往復が不要。</text>
<text x="650" y="696" font-size="11.5" fill="#1b2627">店の前に置くため、ビルの管理者の許可が必要</text>
<text x="634" y="730" font-size="13" font-weight="700" fill="#1b2627">店ごとの使い分け</text>
<text x="634" y="754" font-size="11.5" fill="#1b2627">近くに深夜も使えるステーションがある店</text>
<text x="1138" y="754" font-size="11.5" font-weight="700" text-anchor="end" fill="#0f7c80">→ KEY STATION</text>
<text x="634" y="774" font-size="11.5" fill="#1b2627">近くにない店・地方の店</text>
<text x="1138" y="774" font-size="11.5" font-weight="700" text-anchor="end" fill="#0f7c80">→ 店前のキーボックス</text>
<text x="634" y="794" font-size="11.5" fill="#1b2627">スマートロックや警備カードがある店</text>
<text x="1138" y="794" font-size="11.5" font-weight="700" text-anchor="end" fill="#0f7c80">→ 既存の仕組みを利用</text>
<text x="40" y="828" font-size="10" fill="#5b6b6d">料金はKEY STATIONの検索画面（2026年10月時点）とキーボックスの参考価格です。保管料1店月3,000円で、1店の粗利は月7.5万円→7.2万円。サロン名と時刻は例です。</text>
